# nginx front-end for the php-fpm-only Invoice Ninja image.
# Serves static files from the app's public/ dir and proxies PHP to app:9000.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/app/public;
    index index.php index.html;

    # Invoice Ninja uploads (logos, documents, PDFs) can be large.
    client_max_body_size 100M;
    fastcgi_read_timeout 300;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff2?|ttf|eot|map)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Deny hidden files except ACME/.well-known.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
