# Invoice Ninja + PayHere — Dokploy Compose stack (fresh install).
#
# The official invoiceninja image is php-fpm only (listens on 9000, FastCGI),
# so a separate nginx service ("web") serves HTTP and proxies PHP to app:9000.
# Point the Dokploy domain at service "web", port 80.
#
# Paste the full env (see .env.dokploy.example) into the Dokploy "Environment"
# tab — Dokploy writes it to a .env next to this file, loaded via env_file.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file: .env
    expose:
      - "9000"
    volumes:
      - in_public:/var/www/app/public
      - in_storage:/var/www/app/storage

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "80"
    volumes:
      - in_public:/var/www/app/public:ro
      - in_storage:/var/www/app/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-ninja}
      MYSQL_USER: ${DB_USERNAME:-ninja}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  in_public:
  in_storage:
  db_data:
