# Invoice Ninja + PayHere — Dokploy Compose stack (fresh install).
#
# Deploy this as a "Compose" application in Dokploy. Paste the full env (see
# .env.dokploy.example) into the Dokploy "Environment" tab — Dokploy writes it
# to a .env next to this file, which the app service loads via env_file.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file: .env
    expose:
      - "80"
    volumes:
      - in_public:/var/www/app/public
      - in_storage:/var/www/app/storage

  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-ninja}
      MYSQL_USER: ${DB_USERNAME:-ninja}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  in_public:
  in_storage:
  db_data:
