# Invoice Ninja + PayHere — Dokploy Compose stack (fresh install).
#
# Deploy this as a "Compose" application in Dokploy. Set the SECRET values
# (APP_KEY, APP_URL, DB_PASSWORD, DB_ROOT_PASSWORD) in the Dokploy Environment
# tab — Dokploy interpolates the ${...} references below from there.
# See .env.dokploy.example for the full list.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - redis
    # Explicit container environment. Infra hosts (db/redis) are fixed here;
    # only secrets come from the Dokploy Environment tab.
    environment:
      APP_NAME: ${APP_NAME:-InvoiceNinja}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      REQUIRE_HTTPS: "true"
      TRUSTED_PROXIES: "*"
      IS_DOCKER: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-ninja}
      DB_USERNAME: ${DB_USERNAME:-ninja}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAIL_MAILER: log
    expose:
      - "80"
    volumes:
      - in_public:/var/www/app/public
      - in_storage:/var/www/app/storage

  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-ninja}
      MYSQL_USER: ${DB_USERNAME:-ninja}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  in_public:
  in_storage:
  db_data:
